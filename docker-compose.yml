# Infra de Fase 1 de PLAN_IMPLEMENTACION_POSTIZ_MAUTIC.md — Mautic (email
# marketing) y Postiz (redes sociales) desplegados tal cual, sin fork. Cada
# uno con su propia base de datos, self-hosted junto al resto de Vendrava.
# El backend de VozIA (backend/) sigue corriendo aparte (fuera de este
# compose) y se conecta a estos dos por API/webhook — nunca por DB compartida.

services:
  mautic-db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MAUTIC_DB_ROOT_PASSWORD:-changeme}
      MYSQL_DATABASE: mautic
      MYSQL_USER: mautic
      MYSQL_PASSWORD: ${MAUTIC_DB_PASSWORD:-changeme}
    volumes:
      - mautic_db_data:/var/lib/mysql

  mautic:
    image: mautic/mautic:v5-apache
    restart: unless-stopped
    depends_on:
      - mautic-db
    environment:
      MAUTIC_DB_HOST: mautic-db
      MAUTIC_DB_NAME: mautic
      MAUTIC_DB_USER: mautic
      MAUTIC_DB_PASSWORD: ${MAUTIC_DB_PASSWORD:-changeme}
    ports:
      - '8100:80'
    volumes:
      - mautic_data:/var/www/html

  postiz:
    image: ghcr.io/gitroomhq/postiz-app:latest
    restart: unless-stopped
    depends_on:
      - postiz-db
      - postiz-redis
    environment:
      DATABASE_URL: postgresql://postiz:${POSTIZ_DB_PASSWORD:-changeme}@postiz-db:5432/postiz
      REDIS_URL: redis://postiz-redis:6379
      JWT_SECRET: ${POSTIZ_JWT_SECRET:-changeme}
      MAIN_URL: ${POSTIZ_BASE_URL:-http://localhost:8101}
      FRONTEND_URL: ${POSTIZ_BASE_URL:-http://localhost:8101}
      NEXT_PUBLIC_BACKEND_URL: ${POSTIZ_BASE_URL:-http://localhost:8101}/api
    ports:
      - '8101:5000'
    volumes:
      - postiz_data:/uploads

  postiz-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postiz
      POSTGRES_PASSWORD: ${POSTIZ_DB_PASSWORD:-changeme}
      POSTGRES_DB: postiz
    volumes:
      - postiz_db_data:/var/lib/postgresql/data

  postiz-redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - postiz_redis_data:/data

volumes:
  mautic_db_data:
  mautic_data:
  postiz_db_data:
  postiz_redis_data:
