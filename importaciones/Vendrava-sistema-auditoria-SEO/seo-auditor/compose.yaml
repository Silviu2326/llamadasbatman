services:
  auditor:
    build: .
    ports:
      - "127.0.0.1:8787:8787"
    env_file: .env
    volumes:
      - auditor_data:/data
    shm_size: 1gb
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  auditor_data:
